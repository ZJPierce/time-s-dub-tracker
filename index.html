<title>It's Time S Dub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&family=Chivo+Mono:wght@400;600&display=swap">
<style>
/* Layout: stadium jumbotron hero (parlay odds + sweat graph), then one stacked "ticket stub" per leg, blame board last. Single committed dark look. */
:root{
  --field:#0d1320; --panel:#151d2c; --panel2:#1b2538; --line:#28344c;
  --ink:#eaf0f8; --mute:#8d9bb4; --led:#ffb627; --led-dim:#5c4417;
  --win:#3bdc8c; --loss:#ff5d6c; --warn:#ff8f3c;
  --f-display:"Big Shoulders Display","Impact","Arial Narrow",sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-mono:"Chivo Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--field);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;
  background-image:radial-gradient(1200px 500px at 50% -200px,#1d2a44 0%,transparent 70%)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.mode{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--mute);background:var(--panel)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.mode.live .dot{background:var(--loss);box-shadow:0 0 0 0 var(--loss);animation:pulse 1.6s infinite}
.mode.demo .dot{background:var(--led)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,108,.6)}70%{box-shadow:0 0 0 8px rgba(255,93,108,0)}100%{box-shadow:0 0 0 0 rgba(255,93,108,0)}}

/* jumbotron */
.tron{position:relative;border:2px solid #000;border-radius:14px;background:#06090f;padding:22px 20px 18px;overflow:hidden;
  box-shadow:0 0 0 1px var(--line),0 20px 60px -20px rgba(0,0,0,.8)}
.tron::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.2px);background-size:4px 4px;mix-blend-mode:screen}
.tron h1{margin:0;font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(30px,7.5vw,52px);line-height:.95;
  letter-spacing:.01em;text-wrap:balance}
.tron .sub{margin-top:8px;color:var(--mute);font-size:15px;max-width:52ch}
.board{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:end;margin-top:18px}
.bigp{font-family:var(--f-display);font-weight:900;font-size:clamp(64px,18vw,120px);line-height:.85;color:var(--led);
  text-shadow:0 0 18px rgba(255,182,39,.45);font-variant-numeric:tabular-nums}
.bigp small{font-size:.42em;vertical-align:top;margin-left:2px}
.oddsrow{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.oddsrow b{color:var(--ink);font-weight:600}
.spark{width:100%;height:90px;min-width:0}
.spark text{fill:var(--mute);font-family:var(--f-mono);font-size:10px}
.tally{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{font-family:var(--f-mono);font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.chip.win{color:var(--win);border-color:rgba(59,220,140,.4)}
.chip.loss{color:var(--loss);border-color:rgba(255,93,108,.4)}
.chip.live{color:var(--led);border-color:rgba(255,182,39,.4)}
@media (max-width:520px){.board{grid-template-columns:1fr;gap:6px}}

/* ticker */
.ticker{overflow:hidden;border-block:1px solid var(--line);white-space:nowrap;font-family:var(--f-mono);font-size:12px;color:var(--mute);padding-block:8px;
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker span{display:inline-block;padding-left:100%;animation:tick 55s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}

/* section label */
.lab{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:6px 0 -8px;
  display:flex;justify-content:space-between;align-items:baseline}
.lab span{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:none}

/* legs */
.legs{display:flex;flex-direction:column;gap:12px}
.leg{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px 20px;
  display:grid;grid-template-columns:1fr auto;gap:10px 16px;transition:transform .3s,border-color .3s}
.leg::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--sev,var(--mute))}
.leg.hit{--sev:var(--win);border-color:rgba(59,220,140,.45);background:linear-gradient(90deg,rgba(59,220,140,.08),var(--panel) 60%)}
.leg.dead{--sev:var(--loss);opacity:.78;background:linear-gradient(90deg,rgba(255,93,108,.08),var(--panel) 60%)}
.leg.cook{--sev:var(--win)} .leg.sweat{--sev:var(--led)} .leg.dire{--sev:var(--warn)} .leg.pre{--sev:var(--mute)}
.leg.flash{animation:flash 1.2s ease}
@keyframes flash{0%{transform:scale(1)}20%{transform:scale(1.02);border-color:var(--win)}100%{transform:scale(1)}}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:18px;color:#0d1320;overflow:hidden;border:2px solid var(--sev,var(--line));transition:filter .4s}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.leg.dead .av{filter:grayscale(1) contrast(1.1)}
.leg.hit .av{box-shadow:0 0 0 3px rgba(59,220,140,.25)}
.mini{width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px}
.who .u{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .g{font-family:var(--f-mono);font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who>div{min-width:0}
.pick{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pick .pl{font-family:var(--f-display);font-weight:900;font-size:26px;text-transform:uppercase;line-height:1}
.pick .mk{color:var(--mute);font-size:14px}
.pr{text-align:right}
.pr .pct{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:.9;font-variant-numeric:tabular-nums}
.leg.hit .pct{color:var(--win)} .leg.dead .pct{color:var(--loss)}
.pr .dl{font-family:var(--f-mono);font-size:11px;color:var(--mute);margin-top:2px;min-height:14px}
.dl.up{color:var(--win)} .dl.down{color:var(--loss)}
.meter{grid-column:1/-1}
.bar{position:relative;height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--sev,var(--mute));border-radius:6px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.td i{width:100%;opacity:.15}
.mrow{display:flex;justify-content:space-between;gap:10px;margin-top:5px;font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.mrow b{color:var(--ink);font-weight:600}
.pill{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.leg.hit .pill{color:var(--win)} .leg.dead .pill{color:var(--loss)} .leg.cook .pill{color:var(--win)}
.leg.sweat .pill{color:var(--led)} .leg.dire .pill{color:var(--warn)} .leg.pre .pill{color:var(--mute)}
.roast{grid-column:1/-1;font-size:14px;color:#c4cee0;border-top:1px dashed var(--line);padding-top:9px;font-style:italic}

/* blame board */
.blame{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.blame table{width:100%;border-collapse:collapse;font-size:14px}
.blame td{padding:10px 14px;border-top:1px solid var(--line)}
.blame tr:first-child td{border-top:0}
.blame td.n{font-family:var(--f-mono);color:var(--mute);width:2.5em}
.blame td.r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-left:6px;color:var(--led)}
.tag.bad{color:var(--loss)}

.foot{font-family:var(--f-mono);font-size:11px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.foot button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;align-self:flex-start}
.foot button:focus-visible{outline:2px solid var(--led);outline-offset:2px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top">
    <div class="brand">It's Time S Dub · Group Parlay</div>

  </div>
</div>

  alive:["Still breathing. Barely.","The slip lives. Nobody move.","Sweat equity is at an all-time high."],
  hot:  ["We are cooking right now.","Book a table. Not yet. But soon."],
  dead: ["It's over. {u} did this.","{u} has ended the dream."],
  won:  ["WE EATING TONIGHT.","Every leg hit. Frame this slip."]
};

/* ================= MATH ================= */
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y}
const Phi=z=>0.5*(1+erf(z/Math.SQRT2));
function poisAtLeast(k,L){if(k<=0)return 1;let s=0,t=Math.exp(-L);for(let i=0;i<k;i++){s+=t;t*=L/(i+1)}return Math.max(0,1-s)}
function fracLeft(g){if(!g||g.state==="pre")return 1;if(g.state==="post")return 0;
  if(g.period<=4)return Math.max(0,((4-g.period)*900+(g.clock||0))/3600);return 0.03}
function legProb(leg,st,g){
  const f=fracLeft(g);
  if(leg.type==="td"){if(st.td>0)return 1;if(f<=0)return 0;const lam=-Math.log(1-leg.p0);return 1-Math.exp(-lam*f)}
  if(leg.type==="rec"){if(st.rec>=leg.line)return 1;if(f<=0)return 0;return poisAtLeast(leg.line-st.rec,leg.lam*f)}
  if(st.recYds>=leg.line)return 1;if(f<=0)return 0;
  const m=leg.mu*f,s=Math.max(5,leg.sd*Math.sqrt(f));return 1-Phi((leg.line-0.5-st.recYds-m)/s);
}
const pct=p=>p>=0.995&&p<1?"99":p>0&&p<0.01?"<1":String(Math.round(p*100));
function american(p){if(p<=0)return"—";if(p>=1)return"LOCK";if(p>=0.5)return"-"+Math.round(100*p/(1-p));return"+"+Math.round(100*(1-p)/p).toLocaleString()}
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[^a-z]/g,"");
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const pickLine=(arr,seed)=>arr[hash(seed)%arr.length];

/* ================= ESPN DATA ================= */
let base=null; // "proxy" | "direct"
async function getJSON(path,qs){
  const tries = base ? [base] : ["proxy","direct"];
  for(const b of tries){
    const url = b==="proxy" ? `api/espn?path=${path}&${qs}` : `${ESPN}${path}?${qs}`;
    try{const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();base=b;return j}catch(e){}
  }
  throw new Error("no data");
}
function parseGames(sb){
  const out={};
  for(const ev of sb.events||[]){
    const c=ev.competitions?.[0];if(!c)continue;
    const a=c.competitors.find(x=>x.homeAway==="away"),h=c.competitors.find(x=>x.homeAway==="home");
    const st=ev.status||c.status||{};
    const key=`${a.team.abbreviation}@${h.team.abbreviation}`;
    out[key]={id:ev.id,state:st.type?.state||"pre",period:st.period||0,clock:st.clock||0,
      detail:st.type?.shortDetail||"",date:ev.date,
      away:{abbr:a.team.abbreviation,score:+a.score||0},home:{abbr:h.team.abbreviation,score:+h.score||0}};
  }
  return out;
}
function statFromBox(summary,player,team){
  const want=norm(player),last=norm(player.split(" ").slice(-1)[0]);
  const res={recYds:0,rec:0,td:0,found:false};
  for(const tm of summary?.boxscore?.players||[]){
    const abbr=tm.team?.abbreviation;
    for(const grp of tm.statistics||[]){
      const keys=grp.keys||[],labels=grp.labels||[];
      const ix=(k,l)=>{let i=keys.indexOf(k);if(i<0)i=labels.indexOf(l);return i};
      for(const a of grp.athletes||[]){
        const nm=norm(a.athlete?.displayName);
        if(nm!==want && !(abbr===team && nm.endsWith(last)))continue;
        res.found=true;const v=i=>i<0?0:parseFloat(a.stats?.[i])||0;
        if(grp.name==="receiving"){res.recYds=v(ix("receivingYards","YDS"));res.rec=v(ix("receptions","REC"));res.td+=v(ix("receivingTouchdowns","TD"))}
        if(grp.name==="rushing")res.td+=v(ix("rushingTouchdowns","TD"));
        if(grp.name==="kickReturns")res.td+=v(ix("kickReturnTouchdowns","TD"));
        if(grp.name==="puntReturns")res.td+=v(ix("puntReturnTouchdowns","TD"));
      }
    }
  }
  return res;
}
async function pullLive(){
  const sb=await getJSON("scoreboard",`dates=${CONFIG.date}&limit=50`);
  const games=parseGames(sb);
  const needed=[...new Set(CONFIG.legs.map(l=>`${l.away}@${l.home}`))];
  const sums={};
  await Promise.all(needed.map(async k=>{const g=games[k];if(g&&g.state!=="pre"){try{sums[k]=await getJSON("summary",`event=${g.id}`)}catch(e){}}}));
  const stats=CONFIG.legs.map(l=>{const k=`${l.away}@${l.home}`;return sums[k]?statFromBox(sums[k],l.player,l.team):{recYds:0,rec:0,td:0,found:false}});
  return {games,stats};
}

/* ================= DEMO SIM ================= */
let demo=null;
function demoInit(){
  const games={};
  for(const l of CONFIG.legs){const k=`${l.away}@${l.home}`;if(!games[k])games[k]={t:k==="NE@MIA"?-900:0,away:{abbr:l.away,score:0},home:{abbr:l.home,score:0}}}
  demo={games,stats:CONFIG.legs.map(()=>({recYds:0,rec:0,td:0,found:true}))};
  // the two Zay legs share one player
}
function demoStep(){
  const STEP=80;
  for(const g of Object.values(demo.games)){
    g.t=Math.min(3600,g.t+STEP);
    if(g.t>0&&g.t<3600&&Math.random()<0.09){(Math.random()<.5?g.away:g.home).score+=Math.random()<.65?7:3}
  }
  const shared={};
  CONFIG.legs.forEach((l,i)=>{
    const g=demo.games[`${l.away}@${l.home}`];if(g.t<=0||g.t>=3600)return;
    const key=l.player;if(shared[key]){demo.stats[i]=shared[key];return}
    const s=demo.stats[i],r=STEP/3600;
    const ypg=l.type==="yds"?l.mu:l.type==="rec"?l.lam*9:45, cpg=l.type==="rec"?l.lam:5;
    if(Math.random()<cpg*r*1.1){s.rec++;s.recYds+=Math.max(2,Math.round(ypg/cpg*(0.4+Math.random()*1.3)))}
    const ptd=l.type==="td"?-Math.log(1-l.p0):0.3;if(Math.random()<ptd*r)s.td++;
    shared[key]=s;
  });
  const games={};
  for(const[k,g]of Object.entries(demo.games)){
    const t=g.t;let state="in",period=Math.min(4,Math.floor(t/900)+1),clock=900-(t%900);
    if(t<=0){state="pre"}else if(t>=3600){state="post";period=4;clock=0}
    if(t>=3600)clock=0;
    const mm=Math.floor(clock/60),ss=String(Math.floor(clock%60)).padStart(2,"0");
    games[k]={state,period,clock,detail:state==="pre"?"Pregame":state==="post"?"Final":`${mm}:${ss} - ${["1st","2nd","3rd","4th"][period-1]}`,away:g.away,home:g.home};
  }
  return {games,stats:demo.stats.map(s=>({...s}))};
}

/* ================= RENDER ================= */
const prev={};const history=[];let mode="connecting";
const $=id=>document.getElementById(id);
function legState(p,g){if(!g||g.state==="pre")return p>=1?"hit":"pre";if(p>=1)return"hit";if(p<=0)return"dead";if(p>=.65)return"cook";if(p>=.3)return"sweat";return"dire"}
const LABEL={pre:"Pregame",hit:"Cashed",dead:"Dead",cook:"Cooking",sweat:"Sweating",dire:"Life support"};
function gameLine(g,l){if(!g)return `${l.away} @ ${l.home} · not on today's board`;
  const s=`${g.away.abbr} ${g.away.score} – ${g.home.score} ${g.home.abbr}`;
  if(g.state==="pre"){const d=g.date?new Date(g.date).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"";return `${g.away.abbr} @ ${g.home.abbr} · ${d||g.detail}`}
  return `${s} · ${g.detail}`}
function initials(u){return u.replace(/[^a-zA-Z]/g,"").slice(0,2).toUpperCase()}

function render({games,stats}){
  const minute=Math.floor(Date.now()/60000);
  const rows=CONFIG.legs.map((l,i)=>{
    const g=games[`${l.away}@${l.home}`],st=stats[i],p=legProb(l,st,g),state=legState(p,g);
    return {l,i,g,st,p,state};
  });
  const parlay=rows.reduce((a,r)=>a*r.p,1);
  history.push(parlay);if(history.length>240)history.shift();

  // legs
  const box=$("legs");
  if(!box.children.length)box.innerHTML=rows.map(r=>`<article class="leg" id="leg${r.i}"></article>`).join("");
  for(const r of rows){
    const {l,st,p,state,g}=r, el=$("leg"+r.i);
    const old=prev[r.i];
    if(old!==undefined && old<1 && p>=1 && g && g.state!=="pre"){el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1300);boom(l.color)}
    const d=old===undefined?0:p-old;
    prev[r.i]=p;
    el.className="leg "+state;
    const market=l.type==="td"?"Anytime TD":l.type==="rec"?`${l.line}+ Receptions`:`${l.line}+ Rec Yards`;
    let cur,goal,w;
    if(l.type==="td"){cur=st.td;goal=1;w=st.td>0?100:0}
    else{cur=l.type==="rec"?st.rec:st.recYds;goal=l.line;w=Math.min(100,cur/goal*100)}
    const unit=l.type==="td"?(st.td===1?"TD":"TDs"):l.type==="rec"?"rec":"yds";
    const extra=l.type==="yds"?`${st.rec} rec`:l.type==="rec"?`${st.recYds} yds`:`${st.recYds} rec yds`;
    const roast=pickLine(ROAST[state],l.user+state+(state==="pre"||state==="hit"||state==="dead"?"":Math.floor(minute/2))).replaceAll("{u}",l.user).replaceAll("{p}",l.player.split(" ").slice(-1)[0]);
    el.innerHTML=`
      <div class="who"><div class="av" style="background:${l.color}">${l.photo?`<img src="${l.photo}" alt="${l.user}">`:initials(l.user)}</div>
        <div><div class="u">${l.user}</div><div class="g">${gameLine(g,l)}</div></div></div>
      <div class="pr"><div class="pct">${pct(p)}%</div>
        <div class="dl ${d>0.005?"up":d<-0.005?"down":""}">${Math.abs(d)>0.005?(d>0?"▲ ":"▼ ")+Math.round(Math.abs(d)*100)+" pts":american(p)}</div></div>
      <div class="pick"><span class="pl">${l.player}</span><span class="mk">${market}${l.odds?` · <span class="mono">${l.odds}</span>`:""}</span><span class="pill">${LABEL[state]}</span></div>
      <div class="meter"><div class="bar${l.type==="td"&&st.td===0?"":""}"><i style="width:${w}%"></i></div>
        <div class="mrow"><span><b>${cur}</b> / ${goal} ${unit}</span><span>${extra}${g&&g.state!=="pre"&&!st.found&&mode==="live"?" · not in box yet":""}</span></div></div>
      <div class="roast">${roast}</div>`;
  }

  // hero
  const live=rows.filter(r=>r.g&&r.g.state==="in").length, hit=rows.filter(r=>r.state==="hit").length,
        dead=rows.filter(r=>r.state==="dead"), pre=rows.filter(r=>r.state==="pre").length;
  const alive=rows.filter(r=>!["hit","dead"].includes(r.state));
  const anchor=[...alive].sort((a,b)=>a.p-b.p)[0];
  let hk="alive";
  if(dead.length)hk="dead";else if(hit===rows.length)hk="won";else if(pre===rows.length)hk="pre";else if(parlay>=.35)hk="hot";
  const culprit=dead[0]?.l.user||"";
  $("headline").textContent=pickLine(HEAD[hk],hk+Math.floor(minute/5)).replaceAll("{u}",culprit);
  $("subline").textContent= hk==="dead"?`${dead.map(r=>r.l.user).join(" & ")} sank it. Remaining legs are now playing for pride.`
    : hk==="won"?"All seven legs cashed. Someone go collect."
    : anchor?`Weakest link right now: ${anchor.l.user} (${anchor.l.player}, ${pct(anchor.p)}%). No pressure.`:"";
  const bp=$("bigp");bp.innerHTML=`${pct(parlay)}<small>%</small>`;bp.style.color=hk==="dead"?"var(--loss)":hk==="won"?"var(--win)":"";
  $("fair").textContent=american(parlay);
  $("onein").textContent=parlay>0?Math.round(1/parlay).toLocaleString():"∞";
  $("tally").innerHTML=`<span class="chip win">${hit} cashed</span><span class="chip live">${live?alive.length+" alive · "+live+" games live":alive.length+" alive"}</span><span class="chip loss">${dead.length} dead</span>`;
  spark();

  // ticker
  const bits=rows.map(r=>`${r.l.user.toUpperCase()}: ${r.l.player} ${r.l.type==="td"?(r.st.td?"SCORED":"no TD yet"):(r.l.type==="rec"?r.st.rec+" rec":r.st.recYds+" yds")} (${pct(r.p)}%)`);
  const games2=Object.values(games).filter(g=>CONFIG.legs.some(l=>`${l.away}@${l.home}`===`${g.away.abbr}@${g.home.abbr}`)).map(g=>`${g.away.abbr} ${g.away.score}-${g.home.score} ${g.home.abbr} ${g.detail}`);
  $("ticker").textContent=[...games2,...bits].join("   ///   ");

  // blame board
  const ranked=[...rows].sort((a,b)=>b.p-a.p);
  $("blame").innerHTML=ranked.map((r,k)=>`<tr><td class="n">${k+1}</td><td>${r.l.photo?`<img class="mini" src="${r.l.photo}" alt="">`:""}${r.l.user}${k===0&&r.p>0?'<span class="tag">carrying</span>':""}${r===anchor?'<span class="tag bad">anchor</span>':""}${r.state==="dead"?'<span class="tag bad">penalty box</span>':""}</td><td class="r">${pct(r.p)}%</td></tr>`).join("");
  $("updated").textContent="updated "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"});
}

function spark(){
  const s=$("spark"),W=400,H=90,n=history.length;if(n<1)return;
  const mx=Math.max(...history,0.001)*1.15;
  const pts=history.map((v,i)=>[n===1?W:i/(n-1)*W, H-6-(v/mx)*(H-20)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  s.innerHTML=`<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb627" stop-opacity=".35"/><stop offset="1" stop-color="#ffb627" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" x2="${W}" y1="${H-6}" y2="${H-6}" stroke="#28344c" stroke-width="1"/>
    <path d="${line} L${W} ${H-6} L0 ${H-6} Z" fill="url(#sg)"/>
    <path d="${line}" fill="none" stroke="#ffb627" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="#ffb627"/>
    <text x="2" y="11">sweat graph · peak ${pct(Math.max(...history))}%</text>`;
}

/* confetti */
const fx=$("fx"),cx=fx.getContext("2d");let parts=[];
function boom(color){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  fx.width=innerWidth;fx.height=innerHeight;
  for(let i=0;i<120;i++)parts.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-3,c:[color,"#ffb627","#3bdc8c","#eaf0f8"][i%4],r:Math.random()*5+3,a:1});
  if(parts.length<=120)requestAnimationFrame(fxLoop);
}
function fxLoop(){cx.clearRect(0,0,fx.width,fx.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a-=.012;cx.globalAlpha=Math.max(0,p.a);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*1.6)});
  parts=parts.filter(p=>p.a>0&&p.y<fx.height+20);if(parts.length)requestAnimationFrame(fxLoop);else cx.clearRect(0,0,fx.width,fx.height)}

/* ================= LOOP ================= */
let timer=null;
function setMode(m){mode=m;const el=$("mode");el.className="mode "+m;
  $("modeTxt").textContent=m==="live"?"Live · ESPN":m==="demo"?"Demo simulation":"Connecting";
  $("demoBtn").textContent=m==="demo"?"Try live data again":"Run demo simulation";
  $("srcnote").textContent=m==="demo"?"Demo mode: fake game flow so you can see the tracker move. Live ESPN stats load when this page is hosted on its own site (e.g. Vercel).":"Stats: ESPN public scoreboard + box score, refreshed every 20s during games. Odds are a live model, not a sportsbook line.";}
async function tickLive(){
  try{const d=await pullLive();setMode("live");render(d);
    const anyLive=Object.values(d.games).some(g=>g.state==="in");timer=setTimeout(tickLive,anyLive?CONFIG.pollLive:CONFIG.pollIdle);}
  catch(e){startDemo()}
}
function startDemo(){clearTimeout(timer);setMode("demo");history.length=0;for(const k in prev)delete prev[k];demoInit();
  const step=()=>{render(demoStep());if(Object.values(demo.games).some(g=>g.t<3600))timer=setTimeout(step,1600)};step()}
$("demoBtn").addEventListener("click",()=>{clearTimeout(timer);if(mode==="demo"){history.length=0;for(const k in prev)delete prev[k];base=null;setMode("connecting");tickLive()}else startDemo()});
if(location.hash==="#demo")startDemo();else tickLive();
</script>
